<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashley Hotels — Portfolio Daybook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#00a59e; --teal-dark:#00847f; --teal-tint:#f2fbfa; --teal-tint-strong:#e2f5f3;
    --charcoal:#232326; --charcoal-soft:#6b6b6f; --hairline:#e6e6e8; --hairline-strong:#d6d6d9;
    --bg:#ffffff; --brick:#a13f2e; --pending:#a6a6ab;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); font-family:'IBM Plex Sans', sans-serif; color:var(--charcoal); padding:44px 20px 64px; min-height:100vh; }
  .sheet{ max-width:1080px; margin:0 auto; background:var(--bg); }

  .masthead{ display:flex; justify-content:space-between; align-items:center; padding:0 0 22px; border-bottom:2px solid var(--charcoal); margin-bottom:16px; }
  .masthead .logo-mark{ height:40px; display:block; }
  .masthead .divider{ width:1px; height:32px; background:var(--hairline-strong); margin:0 20px; }
  .brandtext .kicker{ font-size:10.5px; letter-spacing:.24em; text-transform:uppercase; color:var(--teal-dark); font-weight:600; margin:0 0 3px; }
  .brandtext h1{ font-family:'Fraunces', serif; font-weight:500; font-size:20px; margin:0; color:var(--charcoal); }
  .masthead .dateblock{ text-align:right; font-family:'IBM Plex Mono', monospace; }
  .dateblock .day{ font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--charcoal-soft); }
  .dateblock .full{ font-size:15px; color:var(--charcoal); font-weight:500; }

  .banner{ display:flex; gap:9px; align-items:center; background:var(--teal-tint); border-left:3px solid var(--teal); border-radius:2px; padding:9px 16px; margin-bottom:32px; }
  .banner .icon{ font-family:'Fraunces', serif; font-style:italic; color:var(--teal-dark); font-size:14px; flex:none; }
  .banner p{ margin:0; font-size:12px; line-height:1.5; color:var(--charcoal); }
  .banner strong{ color:var(--teal-dark); }

  .section-label{ font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--teal-dark); font-weight:600; margin:0 0 12px; }

  .summary{ display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--hairline); border:1px solid var(--hairline); margin-bottom:2px; }
  .summary .stat{ background:var(--bg); padding:16px 20px; }
  .summary .stat .label{ font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--charcoal-soft); font-weight:600; margin-bottom:6px; }
  .summary .stat .value{ font-family:'Fraunces', serif; font-weight:500; font-size:24px; color:var(--charcoal); line-height:1; }
  .summary .stat .value .unit{ font-family:'IBM Plex Mono', monospace; font-size:13px; font-weight:500; color:var(--teal-dark); }
  .summary .stat .sub{ margin-top:5px; font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--charcoal-soft); }
  .summary .stat.accent{ border-top:2px solid var(--teal); }

  .detail-panel{ border:1px solid var(--hairline); border-top:none; background:var(--teal-tint); margin-bottom:40px; padding:4px 20px 14px; }
  .detail-panel .dp-head{ display:flex; align-items:center; gap:7px; font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--teal-dark); padding:10px 0 8px; }
  table.daily{ width:100%; border-collapse:collapse; }
  table.daily thead th{ text-align:right; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--charcoal-soft); font-weight:600; padding:0 8px 7px; border-bottom:1px solid var(--hairline-strong); }
  table.daily thead th:first-child{ text-align:left; }
  table.daily tbody td{ padding:8px; text-align:right; font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--charcoal); font-variant-numeric:tabular-nums; border-bottom:1px solid var(--hairline); }
  table.daily tbody tr:last-child td{ border-bottom:none; }
  table.daily tbody td:first-child{ text-align:left; font-family:'IBM Plex Sans', sans-serif; }
  table.daily .hname{ font-weight:600; font-size:12.5px; }
  table.daily .hmeta{ font-size:10px; color:var(--charcoal-soft); display:block; font-family:'IBM Plex Mono', monospace; }
  table.daily td.dim{ color:var(--pending); }
  table.daily td.flagooo{ color:var(--brick); font-weight:600; }

  .mtd-header-row{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; }
  .mtd-header-row .section-label{ margin:0; }
  .mtd-header-row .caption{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--pending); }

  table.mtd{ width:100%; border-collapse:collapse; margin-bottom:10px; }
  table.mtd thead th{ text-align:right; font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--charcoal-soft); font-weight:600; padding:0 10px 10px; border-bottom:1.5px solid var(--charcoal); }
  table.mtd thead th:first-child{ text-align:left; }
  table.mtd thead tr.group-row th{ border-bottom:none; padding-bottom:4px; color:var(--teal-dark); font-size:9.5px; }
  table.mtd tbody td{ padding:15px 10px; text-align:right; font-family:'IBM Plex Mono', monospace; font-size:13.5px; color:var(--charcoal); font-variant-numeric:tabular-nums; border-bottom:1px solid var(--hairline); white-space:nowrap; }
  table.mtd tbody td:first-child{ text-align:left; font-family:'IBM Plex Sans', sans-serif; white-space:normal; }
  table.mtd tbody tr:nth-child(even){ background:var(--teal-tint); }
  table.mtd tbody tr:hover{ background:var(--teal-tint-strong); }

  .prop-name{ font-family:'Fraunces', serif; font-weight:500; font-size:16px; color:var(--charcoal); margin:0 0 2px; }
  .prop-meta{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--charcoal-soft); }
  .prop-meta .flag{ display:inline-block; margin-left:6px; padding:1px 6px; border:1px solid var(--teal); border-radius:2px; color:var(--teal-dark); font-size:9px; letter-spacing:.06em; text-transform:uppercase; }

  td.revenue{ font-weight:600; }
  td.pending{ color:var(--pending); font-style:italic; font-size:11.5px; font-weight:400; }
  td.dim{ color:var(--pending); }
  .varneg{ color:var(--brick); font-size:11.5px; display:block; }
  .varpos{ color:var(--teal-dark); font-size:11.5px; display:block; }

  .occbar-wrap{ display:inline-flex; align-items:center; gap:8px; }
  .occbar{ width:40px; height:5px; border-radius:3px; background:var(--hairline-strong); overflow:hidden; display:inline-block; }
  .occbar span{ display:block; height:100%; background:var(--teal); border-radius:3px; }

  tr.totals td{ border-top:2px solid var(--charcoal); border-bottom:none; font-weight:600; padding-top:16px; }
  tr.totals .prop-name{ font-style:italic; font-size:14px; }

  .footnotes{ margin-top:30px; padding-top:20px; border-top:1px solid var(--hairline); }
  .footnotes .note{ display:flex; gap:10px; font-size:12.5px; color:var(--charcoal-soft); line-height:1.6; margin-bottom:10px; max-width:840px; }
  .footnotes .note strong{ color:var(--charcoal); }
  .footnotes .note .bullet{ font-family:'Fraunces', serif; font-style:italic; color:var(--teal-dark); flex:none; }
  .footnotes .signoff{ margin-top:20px; padding-top:14px; border-top:1px dotted var(--hairline-strong); display:flex; justify-content:space-between; font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--pending); }

  @media (max-width:820px){
    .summary{ grid-template-columns:1fr; }
    table.daily thead, table.mtd thead{ display:none; }
    table.daily, table.daily tbody, table.daily tr, table.daily td,
    table.mtd, table.mtd tbody, table.mtd tr, table.mtd td{ display:block; width:100%; }
    table.daily tbody tr, table.mtd tbody tr{ padding:12px 4px; border-bottom:1px solid var(--hairline-strong); }
    table.daily tbody td, table.mtd tbody td{ border-bottom:none; text-align:left; padding:3px 4px; white-space:normal; }
    table.daily tbody td:not(:first-child)::before, table.mtd tbody td:not(:first-child)::before{
      content: attr(data-label) ": "; color:var(--charcoal-soft); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; }
  }
</style>
</head>
